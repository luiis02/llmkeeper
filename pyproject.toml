[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmkeeper"
version = "0.1.0"
description = "Local topic-drift guard for LLM conversations"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.118,<1.0",
  "uvicorn[standard]>=0.34",
  "sentence-transformers>=3.3",
  "torch>=2.6",
  "numpy>=1.26,<3.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: tests that load the real embedding model (slow)"]
addopts = "-m 'not integration'"

[tool.hatch.build.targets.wheel]
packages = ["src/llmkeeper"]
